name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: outscale/.github/gitleaks@cc76c3e03f3c7a83a09914b1ed65b7fea5605fb8 # v1.5.1
        with:
          gitleaks-license: ${{ secrets.GITLEAKS_LICENSE }}
