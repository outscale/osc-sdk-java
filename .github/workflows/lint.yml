name: Lint

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint-reuse:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔍️ Check Reuse
        run: make reuse-test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⬇️ Setup Toolchain
        uses: ./.github/actions/common-ci
      - name: 🔍️ Check Style
        run: mvn spotless:check
