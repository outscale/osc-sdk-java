name: pull-request

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
    
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🚀 Lunch VCR Server
        run: |
          python3 ./.github/scripts/vcr.py replay &
      - name: 🧪 Run Tests
        uses: ./.github/actions/run-test
        env:
          OSC_ACCESS_KEY: 1111222233334444
          OSC_SECRET_KEY: AAAABBBBCCCCDDDDEEEEFFFF
          OSC_REGION: gh-test-1
          OSC_ENDPOINT_API: http://127.0.0.1:8000/api/v1
